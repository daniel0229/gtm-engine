# Keywords that decide a store's main product category in the enrich step (src/enrich.py).
#
# Category ids are the category_fit values in icp.yaml plus the excluded categories
# (target.categories.exclude), so the excluded_category disqualifier can be read from the same signal.
# A store whose best score stays under `min_score` gets "other".
#
# Each keyword is a regular expression matched at the start of a word, on text that is lowercased
# and stripped of Polish diacritics (ą->a, ł->l, ż->z ...). Write keywords without diacritics.
# "sukienk" matches sukienka, sukienki, sukienkach.
#
# Where the text comes from and how much it weighs is set in `weights`. Every keyword counts once
# per piece of text (one menu link, the title), so a long menu does not outweigh the title.
version: 1

min_score: 3

weights:
  title: 3             # <title>
  meta_description: 3  # <meta name="description">
  h1: 2
  nav_link: 1          # text of each unique link on the homepage
  serp_hint: 2         # category of the Google query the domain was found with (company_sources)

