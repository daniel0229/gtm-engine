# Google queries used to find Polish online stores (source 3 in docs/sources.md).
# Each query is sent once to the DataForSEO SERP API (Google, Poland, Polish, desktop, top 20).
# Categories match target.categories.include in icp.yaml. Product queries ("sukienki na wesele")
# return store pages more often than generic ones ("sklep z odzieżą"), which return rankings and marketplaces.
# Weighted towards fashion, footwear and accessories, the strongest fit in icp.yaml (segment.definition).
